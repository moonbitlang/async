name: check

on:
  push:
    branches:
      - main
  pull_request:

env:
  MOONBIT_ASYNC_CHECK_FD_LEAK: 1

jobs:
  pidfd-sigkill-line-limit-repro:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      MOONBIT_NEW_NATIVE: 0
      MOONBIT_ALLOCATOR: system
    steps:
      - uses: actions/checkout@v4

      - name: build repro
        run: |
          gcc -O0 -Wall -Wextra -fsanitize=address -pthread tools/pidfd_sigkill_line_limit_repro.c -o /tmp/pidfd_sigkill_line_limit_repro
          gcc -O0 -Wall -Wextra -pthread tools/pidfd_sigkill_line_limit_repro.c -o /tmp/pidfd_sigkill_line_limit_repro_plain
          gcc -O0 -g -fno-omit-frame-pointer -fsanitize=address -Wall -Wextra tools/pidfd_repro_cat.c -o /tmp/pidfd_repro_cat_asan
          gcc -O0 -g -fno-omit-frame-pointer -Wall -Wextra tools/pidfd_repro_cat.c -o /tmp/pidfd_repro_cat_plain

      - name: run repro
        run: |
          repro_status=0
          run_variant() {
            variant_name="$1"
            repro_bin="$2"
            cat_bin="$3"
            signal_num="$4"
            flow_mode="$5"
            delay_list="$6"
            eof_spin_us="$7"
            for delay_us in ${delay_list}; do
              echo "======== pidfd C repro variant=${variant_name} delay_us=${delay_us} eof_spin_us=${eof_spin_us:-0} ========"
              log="/tmp/pidfd-c-${variant_name}-${delay_us}.log"
              set +e
              if [ -n "${eof_spin_us}" ]; then
                PIDFD_REPRO_CAT_EOF_SPIN_US="${eof_spin_us}" "${repro_bin}" 200 "${cat_bin}" 1 0 1 "${delay_us}" "${signal_num}" "${flow_mode}" > "${log}" 2>&1
              else
                "${repro_bin}" 200 "${cat_bin}" 1 0 1 "${delay_us}" "${signal_num}" "${flow_mode}" > "${log}" 2>&1
              fi
              status=$?
              set -e
              tail -n 3 "${log}"
              if [ "${status}" -eq 100 ]; then
                repro_status=100
              elif [ "${status}" -ne 0 ]; then
                cat "${log}"
                exit "${status}"
              fi
            done
          }

          run_variant close-stdin-only-asan /tmp/pidfd_sigkill_line_limit_repro /tmp/pidfd_repro_cat_asan 9 1 "3250 3500 3750" ""
          run_variant plain-eof-spin-3500 /tmp/pidfd_sigkill_line_limit_repro_plain /tmp/pidfd_repro_cat_plain 9 1 "2500 3000 3500 4000 4500 5000 5500 6000 6500 7000 7500" "3000"
          exit "${repro_status}"

  sanitizer-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MOONBIT_NEW_NATIVE: 0
      MOONBIT_ALLOCATOR: system
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: '>=22.4.0'

      - name: install
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: moon version
        run: |
          moon version --all
          moonrun --version

      - name: moon update
        run: |
          moon update

      - name: setup sanitizer check
        run: |
          moon run --debug test_programs/setup_sanitizer_check
          gcc -O0 -g -fno-omit-frame-pointer -fsanitize=address -Wall -Wextra tools/pidfd_repro_cat.c -o /tmp/pidfd_repro_cat_asan

      - name: build pidfd sequential repro
        run: |
          moon build examples/pidfd_sequential_repro

      - name: run pidfd sequential repro with address sanitizer
        run: |
          repro="_build/native/debug/build/moonbitlang/async_examples/pidfd_sequential_repro/pidfd_sequential_repro.exe"
          for i in $(seq 1 20); do
            "$repro" /tmp/pidfd_repro_cat_asan
          done
