name: check

on:
  push:
    branches:
      - main
  pull_request:

env:
  MOONBIT_ASYNC_CHECK_FD_LEAK: 1

jobs:
  pidfd-sigkill-line-limit-repro:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      MOONBIT_NEW_NATIVE: 0
      MOONBIT_ALLOCATOR: system
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: '>=22.4.0'

      - name: install
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: build repro
        run: |
          moon version --all
          moon update
          moon run --debug test_programs/setup_sanitizer_check
          moon build test_programs/cat --debug --target-dir _build/test_programs
          gcc -O2 -Wall -Wextra tools/pidfd_sigkill_line_limit_repro.c -o /tmp/pidfd_sigkill_line_limit_repro

      - name: run repro
        run: |
          cat_prog="$PWD/_build/test_programs/native/debug/build/moonbitlang/async_test_programs/cat/cat.exe"
          /tmp/pidfd_sigkill_line_limit_repro 10000 "$cat_prog" 1000 20
          export ASAN_OPTIONS=detect_leaks=0
          /tmp/pidfd_sigkill_line_limit_repro 10000 "$cat_prog" 1000 20

  sanitizer-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MOONBIT_NEW_NATIVE: 0
      MOONBIT_ALLOCATOR: system
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: '>=22.4.0'

      - name: install
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: moon version
        run: |
          moon version --all
          moonrun --version

      - name: moon update
        run: |
          moon update

      - name: setup sanitizer check
        run: |
          moon run --debug test_programs/setup_sanitizer_check

      - name: run test with address sanitizer
        run: |
          export MOONBIT_ASYNC_TEST_SANITIZER_ENABLED=1
          for _ in $(seq 1 20); do
            moon test src/shell/lines_test.mbt -F "the line cap counts content, not terminators"
          done
