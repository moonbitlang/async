name: check

on:
  push:
    branches:
      - main
  pull_request:

env:
  MOONBIT_ASYNC_CHECK_FD_LEAK: 1

jobs:
  pidfd-sigkill-line-limit-repro:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      MOONBIT_NEW_NATIVE: 0
      MOONBIT_ALLOCATOR: system
    steps:
      - uses: actions/checkout@v4

      - name: install strace
        run: |
          sudo apt-get update
          sudo apt-get install -y strace

      - name: build repro
        run: |
          gcc -O0 -Wall -Wextra -fsanitize=address -pthread tools/pidfd_sigkill_line_limit_repro.c -o /tmp/pidfd_sigkill_line_limit_repro
          gcc -O0 -g -fno-omit-frame-pointer -fsanitize=address -Wall -Wextra tools/pidfd_repro_cat.c -o /tmp/pidfd_repro_cat_asan

      - name: run single-iteration C repro under strace
        run: |
          mkdir -p /tmp/pidfd-c-strace
          ASAN_OPTIONS=detect_leaks=0 strace -f -r -s 200 \
            -e trace=clone,clone3,fork,vfork,execve,pipe,pipe2,fcntl,epoll_ctl,epoll_wait,read,write,close,kill,wait4,waitid,rt_sigaction,rt_sigprocmask \
            -o /tmp/pidfd-c-strace/single-iteration.trace \
            /tmp/pidfd_sigkill_line_limit_repro 1 /tmp/pidfd_repro_cat_asan 1 20 1 \
            > /tmp/pidfd-c-strace/single-iteration.log 2>&1

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pidfd-c-repro-strace
          path: /tmp/pidfd-c-strace
          if-no-files-found: ignore

  sanitizer-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MOONBIT_NEW_NATIVE: 0
      MOONBIT_ALLOCATOR: system
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: '>=22.4.0'

      - name: install strace
        run: |
          sudo apt-get update
          sudo apt-get install -y strace

      - name: install
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: moon version
        run: |
          moon version --all
          moonrun --version

      - name: moon update
        run: |
          moon update

      - name: setup sanitizer check
        run: |
          moon run --debug test_programs/setup_sanitizer_check
          gcc -O0 -g -fno-omit-frame-pointer -fsanitize=address -Wall -Wextra tools/pidfd_repro_cat.c -o /tmp/pidfd_repro_cat_asan

      - name: build pidfd sequential repro
        run: |
          moon -C examples build pidfd_sequential_repro

      - name: run pidfd sequential repro without strace
        run: |
          repro="_build/native/debug/build/moonbitlang/async_examples/pidfd_sequential_repro/pidfd_sequential_repro.exe"
          hit=0
          for i in $(seq 1 100); do
            set +e
            ASAN_OPTIONS=detect_leaks=0 MOONBIT_ASYNC_PIDFD_EAGAIN_FATAL=1 \
              "$repro" /tmp/pidfd_repro_cat_asan
            status=$?
            set -e
            if [ "$status" -ne 0 ]; then
              echo "MoonBit pidfd sequential repro failed without strace on attempt ${i} with status ${status}"
              hit=1
              break
            fi
          done
          if [ "$hit" -eq 0 ]; then
            echo "MoonBit pidfd sequential repro did not fail without strace in 100 attempts"
          fi

      - name: run pidfd sequential repro under strace
        run: |
          mkdir -p /tmp/pidfd-moonbit-strace
          repro="_build/native/debug/build/moonbitlang/async_examples/pidfd_sequential_repro/pidfd_sequential_repro.exe"
          for i in $(seq 1 100); do
            trace="/tmp/pidfd-moonbit-strace/attempt-${i}.trace"
            log="/tmp/pidfd-moonbit-strace/attempt-${i}.log"
            set +e
            ASAN_OPTIONS=detect_leaks=0 MOONBIT_ASYNC_PIDFD_EAGAIN_FATAL=1 \
              strace -f -r -s 200 \
              -e trace=clone,clone3,fork,vfork,execve,pipe,pipe2,fcntl,epoll_ctl,epoll_wait,read,write,close,kill,wait4,waitid,rt_sigaction,rt_sigprocmask \
              -o "$trace" "$repro" /tmp/pidfd_repro_cat_asan \
              > "$log" 2>&1
            status=$?
            set -e
            if [ "$status" -ne 0 ]; then
              echo "MoonBit pidfd sequential repro failed on attempt ${i} with status ${status}"
              cat "$log"
              exit "$status"
            fi
            rm -f "$trace" "$log"
          done

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: pidfd-moonbit-repro-strace
          path: /tmp/pidfd-moonbit-strace
          if-no-files-found: ignore

      - name: run test with address sanitizer
        run: |
          export MOONBIT_ASYNC_TEST_SANITIZER_ENABLED=1
          export MOONBIT_ASYNC_C_CAT_PROG=/tmp/pidfd_repro_cat_asan
          for filter in \
            "min process c cat" \
            "min process c cat sequential" \
            "min process c cat sequential sleep before kill"; do
            echo "======================== ${filter} ============================="
            for _ in $(seq 1 20); do
              moon test src/shell/line_cap_minimize_test.mbt -F "$filter"
            done
          done
