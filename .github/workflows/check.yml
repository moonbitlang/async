name: check

on:
  push:
    branches:
      - main
  pull_request:

env:
  MOONBIT_ASYNC_CHECK_FD_LEAK: 1

jobs:
  stable-build:
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-latest"]

    runs-on: ${{ matrix.os }}
    continue-on-error: false
    # The test suite cold-builds a few small `moonx` tool packages on every
    # fresh runner; give the full-matrix build jobs headroom for that.
    timeout-minutes: 15
    steps:
      - name: disable auto CRLF
        if: ${{ matrix.os == 'windows-latest' }}
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: '>=22.4.0'
      - name: install MSVC (Windows)
        if: ${{ matrix.os == 'windows-latest' }}
        uses: ilammy/msvc-dev-cmd@v1

      - name: install (Unix)
        if: ${{ matrix.os != 'windows-latest' }}
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: install (Windows)
        if: ${{ matrix.os == 'windows-latest' }}
        run: |
          Set-ExecutionPolicy RemoteSigned -Scope CurrentUser; irm https://cli.moonbitlang.com/install/powershell.ps1 | iex
          "C:\Users\runneradmin\.moon\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: moon version
        run: |
          moon version --all
          moonrun --version

      - name: moon update
        run: |
          moon update

      - name: moon check
        run: moon check --deny-warn

      - name: dump process limits
        if: ${{ runner.os == 'Linux' }}
        shell: bash
        run: |
          echo "::group::process limits"
          uname -a || true
          id || true
          nproc || true
          getconf _NPROCESSORS_ONLN || true
          getconf CHILD_MAX || true
          ulimit -a || true
          cat /proc/self/limits || true
          sysctl kernel.pid_max kernel.threads-max || true
          for file in \
            /sys/fs/cgroup/pids.current \
            /sys/fs/cgroup/pids.max \
            /sys/fs/cgroup/*/pids.current \
            /sys/fs/cgroup/*/pids.max
          do
            if [ -e "$file" ]; then
              printf '%s: ' "$file"
              cat "$file" || true
            fi
          done
          echo "current cgroup:"
          cat /proc/self/cgroup || true
          while IFS=: read -r _ _ path; do
            cg="/sys/fs/cgroup${path}"
            echo "cgroup: $cg"
            for file in pids.current pids.max pids.events; do
              if [ -e "$cg/$file" ]; then
                printf '%s: ' "$cg/$file"
                cat "$cg/$file" || true
              fi
            done
          done < /proc/self/cgroup
          ps -eLf | wc -l || true
          ps -eo pid,ppid,nlwp,stat,comm --sort=pid | tail -n 40 || true
          echo "::endgroup::"

      - name: moon test
        run: moon test

      - name: moon test (release)
        run: moon test --release

  nightly-build:
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-latest"]

    runs-on: ${{ matrix.os }}
    continue-on-error: false
    # The test suite cold-builds a few small `moonx` tool packages on every
    # fresh runner; give the full-matrix build jobs headroom for that.
    timeout-minutes: 15
    steps:
      - name: disable auto CRLF
        if: ${{ matrix.os == 'windows-latest' }}
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: '>=22.4.0'

      - name: install MSVC (Windows)
        if: ${{ matrix.os == 'windows-latest' }}
        uses: ilammy/msvc-dev-cmd@v1

      - name: install (Unix)
        if: ${{ matrix.os != 'windows-latest' }}
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s nightly
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: install (Windows)
        if: ${{ matrix.os == 'windows-latest' }}
        env:
          MOONBIT_INSTALL_VERSION: nightly
        run: |
          Set-ExecutionPolicy RemoteSigned -Scope CurrentUser; irm https://cli.moonbitlang.com/install/powershell.ps1 | iex
          "C:\Users\runneradmin\.moon\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: moon version
        run: |
          moon version --all
          moonrun --version

      - name: moon update
        run: |
          moon update

      - name: moon check
        run: moon check

      - name: dump process limits
        if: ${{ runner.os == 'Linux' }}
        shell: bash
        run: |
          echo "::group::process limits"
          uname -a || true
          id || true
          nproc || true
          getconf _NPROCESSORS_ONLN || true
          getconf CHILD_MAX || true
          ulimit -a || true
          cat /proc/self/limits || true
          sysctl kernel.pid_max kernel.threads-max || true
          for file in \
            /sys/fs/cgroup/pids.current \
            /sys/fs/cgroup/pids.max \
            /sys/fs/cgroup/*/pids.current \
            /sys/fs/cgroup/*/pids.max
          do
            if [ -e "$file" ]; then
              printf '%s: ' "$file"
              cat "$file" || true
            fi
          done
          echo "current cgroup:"
          cat /proc/self/cgroup || true
          while IFS=: read -r _ _ path; do
            cg="/sys/fs/cgroup${path}"
            echo "cgroup: $cg"
            for file in pids.current pids.max pids.events; do
              if [ -e "$cg/$file" ]; then
                printf '%s: ' "$cg/$file"
                cat "$cg/$file" || true
              fi
            done
          done < /proc/self/cgroup
          ps -eLf | wc -l || true
          ps -eo pid,ppid,nlwp,stat,comm --sort=pid | tail -n 40 || true
          echo "::endgroup::"

      - name: moon test
        run: moon test

      - name: moon test (release)
        run: moon test --release

  sanitizer-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MOONBIT_NEW_NATIVE: 0
      MOONBIT_ALLOCATOR: system
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: '>=22.4.0'

      - name: install
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: moon version
        run: |
          moon version --all
          moonrun --version

      - name: moon update
        run: |
          moon update

      - name: setup sanitizer check
        run: |
          moon run --debug test_programs/setup_sanitizer_check

      - name: dump process limits
        if: ${{ runner.os == 'Linux' }}
        shell: bash
        run: |
          echo "::group::process limits"
          uname -a || true
          id || true
          nproc || true
          getconf _NPROCESSORS_ONLN || true
          getconf CHILD_MAX || true
          ulimit -a || true
          cat /proc/self/limits || true
          sysctl kernel.pid_max kernel.threads-max || true
          for file in \
            /sys/fs/cgroup/pids.current \
            /sys/fs/cgroup/pids.max \
            /sys/fs/cgroup/*/pids.current \
            /sys/fs/cgroup/*/pids.max
          do
            if [ -e "$file" ]; then
              printf '%s: ' "$file"
              cat "$file" || true
            fi
          done
          echo "current cgroup:"
          cat /proc/self/cgroup || true
          while IFS=: read -r _ _ path; do
            cg="/sys/fs/cgroup${path}"
            echo "cgroup: $cg"
            for file in pids.current pids.max pids.events; do
              if [ -e "$cg/$file" ]; then
                printf '%s: ' "$cg/$file"
                cat "$cg/$file" || true
              fi
            done
          done < /proc/self/cgroup
          ps -eLf | wc -l || true
          ps -eo pid,ppid,nlwp,stat,comm --sort=pid | tail -n 40 || true
          echo "::endgroup::"

      - name: run test with address sanitizer
        run: |
          export MOONBIT_ASYNC_TEST_SANITIZER_ENABLED=1
          moon test
